<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokecard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card-container">

        <div class="card">

            <div class="image">
                <img src="" alt="Pokemon Image" class="pokemon-image">
            </div>

            <div class="info">
                <h1 id="pokemon-name">Pokemon Name</h1>
                <p id="pokemon-type">Type: </p>
                <p id="pokemon-height">Height: </p>
                <p id="pokemon-weight">Weight: </p>
                <p id="pokemon-abilities">Abilities: </p>
            </div>

            <div class="shiny-sparkles">
                <span>✦</span>
                <span>✧</span>
                <span>✦</span>
                <span>✧</span>
                <span>✦</span>
            </div>

        </div>

        <div class="back-card">
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
